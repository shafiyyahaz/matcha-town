<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8fbf7a">
  <title>Matcha Town 🍵</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍵</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="welcome" class="screen welcome">
    <div class="cloud cloud-a">☁️</div>
    <div class="cloud cloud-b">☁️</div>
    <div class="welcome-card">
      <div class="logo">🍵🌿</div>
      <p class="eyebrow">A tiny green world</p>
      <h1>Matcha Town</h1>
      <p class="tagline">A tiny green town full of sweet little things.</p>
      <button id="enterBtn" class="primary-btn">ENTER TOWN <span>→</span></button>
      <p class="hint">Explore • Collect • Make friends • Unlock</p>
    </div>
  </section>

  <main id="game" class="game hidden">
    <header class="hud">
      <div class="brand-mini">🍵 <span>Matcha Town</span></div>
      <div class="stats">
        <div class="stat">🪙 <b id="coins">120</b></div>
        <div class="stat">⭐ <b id="xp">0</b>/100</div>
        <div class="stat">❤️ <b id="energy">5</b>/5</div>
      </div>
    </header>

    <section class="town">
      <div class="sky">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
      </div>

      <div class="hill hill-back"></div>
      <div class="hill hill-front"></div>

      <div class="tree tree1">🌳</div>
      <div class="tree tree2">🌳</div>
      <div class="tree tree3">🌲</div>
      <div class="tree tree4">🌳</div>

      <button class="location-card cafe" data-place="cafe">
        <span class="building">🍵</span>
        <strong>Matcha Café</strong>
        <small>Have a cozy drink</small>
      </button>

      <button class="location-card shop" data-place="shop">
        <span class="building">🛍️</span>
        <strong>Little Shop</strong>
        <small>Browse cute things</small>
      </button>

      <button class="location-card garden" data-place="garden">
        <span class="building">🌱</span>
        <strong>Matcha Garden</strong>
        <small>Collect little leaves</small>
      </button>

      <button class="location-card house" data-place="house">
        <span class="building">🏠</span>
        <strong>Cozy House</strong>
        <small>Your little home</small>
      </button>

      <div class="square">
        <div class="fountain" id="fountain" title="Click the fountain">⛲</div>
        <div class="flower f1">🌷</div>
        <div class="flower f2">🌼</div>
        <div class="flower f3">🌷</div>
      </div>

      <div id="npc1" class="npc npc1" data-npc="Momo">🧑🏻‍🌾</div>
      <div id="npc2" class="npc npc2" data-npc="Mimi">👧🏻</div>
      <div id="npc3" class="npc npc3" data-npc="Kiki">🧒🏻</div>

      <div id="player" class="player">🧑🏻‍🎨</div>

      <div class="leaf leaf1">🍃</div>
      <div class="leaf leaf2">🍃</div>
      <div class="leaf leaf3">🍂</div>
      <div class="leaf leaf4">🍃</div>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-panel="home">🏡<span>Town</span></button>
      <button class="nav-btn" data-panel="quest">🎯<span>Quest</span></button>
      <button class="nav-btn" data-panel="inventory">🎒<span>Bag</span></button>
      <button class="nav-btn" data-panel="map">🗺️<span>Map</span></button>
    </nav>

    <div id="panel" class="panel hidden">
      <div class="panel-inner">
        <button id="closePanel" class="close">×</button>
        <div id="panelContent"></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
